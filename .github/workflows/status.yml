name: cloud-status

on:
  schedule:
    # 每 4 小时，北京 04:00 08:00 12:00 16:00 20:00 24:00 = UTC 前 8 小时
    - cron: "0 20,0,4,8,12,16 * * *"
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CLOUD_UUID_SELF: ${{ secrets.CLOUD_UUID_SELF }}
      CLOUD_TOKEN_SELF: ${{ secrets.CLOUD_TOKEN_SELF }}
      CLOUD_UUID_FRIEND: ${{ secrets.CLOUD_UUID_FRIEND }}
      CLOUD_TOKEN_FRIEND: ${{ secrets.CLOUD_TOKEN_FRIEND }}
      CLOUD_UUID_JIN: ${{ secrets.CLOUD_UUID_JIN }}
      CLOUD_TOKEN_JIN: ${{ secrets.CLOUD_TOKEN_JIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install requests
      - name: run cloud status
        id: run
        run: |
          set -o pipefail
          python cloud_order.py --status 2>&1 | tee .status.log
      - name: push status
        if: ${{ steps.run.outcome == 'success' }}
        run: |
          git config user.name "auto-status"
          git config user.email "actions@users.noreply.github.com"
          git add .re/status.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "status: 账号/菜单/已订监测 @$(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then break; fi
              sleep 5
            done
          fi